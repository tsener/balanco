name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-coverage
          path: coverage
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  linux:
    name: Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake openssl
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Format
        run: cargo +1.90.0 fmt --all -- --check
      - name: Lint
        run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - name: Install coverage tool
        run: cargo +1.90.0 install cargo-llvm-cov --version 0.9.1 --locked
      - name: Inline unit checks and coverage
        run: |
          mkdir -p coverage
          cargo +1.90.0 llvm-cov --locked --all-targets --remap-path-prefix --lcov --output-path coverage/lcov.info
          test -s coverage/lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
      - name: Build release and plugin example
        run: |
          cargo +1.90.0 build --locked --release
          cargo +1.90.0 run --locked --example header_plugin
      - name: Validate plaintext examples
        run: |
          target/release/balanco --config examples/tcp.json --check
          target/release/balanco --config examples/http1.json --check
      - name: Package executable and corresponding source
        run: |
          mkdir dist
          cp target/release/balanco target/release/balanco-controller LICENSE dist/
          git archive --format=tar.gz --output=dist/balanco-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: balanco-linux-x86_64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  container:
    name: Static Linux image and binaries
    needs: [linux, sonarqube]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match Cargo.toml version'
          PY
      - name: Build static image
        run: |
          docker build --platform linux/amd64 --file deploy/container/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag balanco:build .
      - name: Render Kubernetes bundle
        run: |
          curl -fsSLo /tmp/kubectl https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
          curl -fsSLo /tmp/kubectl.sha256 https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          chmod 0755 /tmp/kubectl
          /tmp/kubectl kustomize deploy/kubernetes > /tmp/balanco-kubernetes.yaml
      - name: Verify image and package binaries
        run: |
          docker run --rm --network none --read-only --cap-drop ALL balanco:build --version
          docker run --rm --network none --read-only --cap-drop ALL \
            -v "$PWD/examples:/examples:ro" balanco:build --config /examples/tcp.json --check
          mkdir -p static-dist package
          python3 - <<'PY'
          import json
          with open('package/smoke.json', 'w') as config:
              json.dump({'listen': '127.0.0.1:8443', 'control_socket': '/run/balanco/control.sock',
                         'backends': [{'address': '127.0.0.1:9000'}]}, config)
          PY
          docker run --detach --name balanco-smoke --network none --cap-drop ALL \
            -v "$PWD/package/smoke.json:/config.json:ro" balanco:build --config /config.json
          trap 'docker rm -f balanco-smoke >/dev/null 2>&1 || true' EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if docker exec balanco-smoke /bin/balanco --control-socket /run/balanco/control.sock -c show; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then docker logs balanco-smoke; exit 1; fi
          docker rm -f balanco-smoke >/dev/null
          container_id=$(docker create balanco:build)
          trap 'docker rm "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/bin/balanco" package/balanco
          docker cp "$container_id:/bin/balanco-controller" package/balanco-controller
          cp LICENSE package/
          for binary in package/balanco package/balanco-controller; do
            if readelf -l "$binary" | grep -q interpreter; then exit 1; fi
            if readelf -d "$binary" | grep -q NEEDED; then exit 1; fi
          done
          package/balanco --version
          package/balanco --config examples/http1.json --check
          tar -czf static-dist/balanco-linux-amd64-musl.tar.gz -C package balanco balanco-controller LICENSE
          git archive --format=tar.gz --output=static-dist/balanco-source.tar.gz HEAD
          (cd static-dist && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: balanco-static-linux-amd64-${{ github.sha }}
          path: static-dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish GHCR image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker tag balanco:build "$image:sha-$GITHUB_SHA"
          docker push "$image:sha-$GITHUB_SHA"
          docker tag balanco:build "$image:$GITHUB_REF_NAME"
          docker push "$image:$GITHUB_REF_NAME"

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [container]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: balanco-static-linux-amd64-${{ github.sha }}
          path: static-dist
      - name: Create draft with binaries, source and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" static-dist/* --verify-tag --draft \
            --title "Balanco $GITHUB_REF_NAME" \
            --notes 'Static Linux x86-64 binaries, corresponding source, and SHA-256 checksums. Review the deployment guide before use. Container image: ghcr.io/tsener/balanco.'
