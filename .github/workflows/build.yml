name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-coverage
          path: coverage
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  linux:
    name: Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Format
        run: cargo +1.90.0 fmt --all -- --check
      - name: Lint
        run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - name: Install coverage tool
        run: cargo +1.90.0 install cargo-llvm-cov --version 0.9.1 --locked
      - name: Inline unit checks and coverage
        run: |
          mkdir -p coverage
          cargo +1.90.0 llvm-cov --locked --all-targets --remap-path-prefix --lcov --output-path coverage/lcov.info
          test -s coverage/lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
      - name: Build release and plugin example
        run: |
          cargo +1.90.0 build --locked --release
          cargo +1.90.0 run --locked --example header_plugin
      - name: Validate plaintext examples
        run: |
          target/release/balanco --config examples/tcp.json --check
          target/release/balanco --config examples/http1.json --check
      - name: Package executable and corresponding source
        run: |
          mkdir dist
          cp target/release/balanco LICENSE dist/
          git archive --format=tar.gz --output=dist/balanco-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: balanco-linux-x86_64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
