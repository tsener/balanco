apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kubernetes
patches:
  - target:
      kind: Deployment
      name: balanco
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: balanco
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/arch: arm64
