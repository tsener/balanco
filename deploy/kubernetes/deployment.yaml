apiVersion: apps/v1
kind: Deployment
metadata:
  name: balanco
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: balanco
  template:
    metadata:
      labels:
        app: balanco
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: balanco
          # v0.1.1 image index: Linux AMD64 and ARM64.
          image: ghcr.io/tsener/balanco@sha256:bc7f1962fc54c5b155b37e7dd8a4cb4949efa1adc177cf39dd714c0b2a918331
          imagePullPolicy: Always
          args: ["--config", "/etc/balanco/config/balanco.json"]
          lifecycle:
            preStop:
              # Keep accepting while endpoint removal propagates; no shell needed.
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            # The image-owned socket directory resets on container restart.
            # An emptyDir would retain a stale socket after SIGKILL/OOM.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "2"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
          ports:
            - name: tls
              containerPort: 8443
          startupProbe:
            exec:
              command: ["/bin/balanco", "--config", "/etc/balanco/config/balanco.json", "-c", "show"]
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/bin/balanco", "--config", "/etc/balanco/config/balanco.json", "-c", "show"]
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/balanco/config
              readOnly: true
            - name: tls
              mountPath: /etc/balanco/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: balanco-config
        - name: tls
          secret:
            secretName: balanco-tls
            defaultMode: 0440
